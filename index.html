<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Pokémon Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <img id="pokemon-Img" src="" alt="Pokémon artwork">

        <h1 id="pokemon-Name"></h1>
        <p id="pokemon-Id"></p>

        <p id="pokemon-Shiny" class="shiny-badge" hidden>✨ SHINY! ✨</p>

        <dl class="stats">
            <dt>Type</dt>
            <dd id="pokemon-Type"></dd>

            <dt>Abilities</dt>
            <dd id="pokemon-Abilities"></dd>

            <dt>Height</dt>
            <dd id="pokemon-Height"></dd>

            <dt>Weight</dt>
            <dd id="pokemon-Weight"></dd>
        </dl>

        <div class="controls">
            <button id="cry-btn" disabled>🔊 Play Cry</button>
            <button id="pokemon-btn">Catch New Pokémon</button>
        </div>

        <p id="shiny-Count" class="shiny-count"></p>

        <p id="error-box" class="error-box" role="alert"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
